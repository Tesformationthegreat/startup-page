<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyNest</title>
  <!-- Shared page basics. Please do not edit. Put your own styles inside your section. -->
  <style>
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: #1f2933; line-height: 1.5; }
    section, header, footer { padding: 48px 24px; }
  </style>
</head>
<body>
  <!-- NOSA: top banner goes here -->

  <!-- MURPHY: features go here -->

  <!-- ANITA: pricing goes here -->
<section class="Anita/pricing">
  <style>
    [class~="Anita/pricing"] { text-align: center; }
    [class~="Anita/pricing-grid"] { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
    [class~="Anita/pricing-card"] { border: 1px solid #d1d5db; border-radius: 12px; padding: 20px; max-width: 240px; }
    [class~="Anita/pricing-featured"] { border: 2px solid #2563EB; }
    [class~="Anita/pricing-button"] { display: inline-block; background: #2563EB; color: white; padding: 10px 16px; border-radius: 6px; text-decoration: none; }
  </style>

  <h2>Find a study partner in your course, in minutes.</h2>
  <p>Choose the StudyNest plan that works for you.</p>

  <div class="Anita/pricing-grid">
    <article class="Anita/pricing-card">
      <h3>Free</h3>
      <p><strong>$0</strong> / forever</p>
      <p>Find a study partner in your course.</p>
      <a class="Anita/pricing-button" href="#signup">Get started</a>
    </article>

    <article class="Anita/pricing-card Anita/pricing-featured">
      <h3>Paid</h3>
      <p><strong>$4</strong> / month</p>
      <p>More matches and priority introductions.</p>
      <a class="Anita/pricing-button" href="#signup">Choose Paid</a>
    </article>
  </div>
</section>

  <!-- JEL: signup form goes here -->

  <!-- WILLIAM: footer goes here -->
</body>
</html>
